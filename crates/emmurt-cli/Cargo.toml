[package]
name = "emmurt-cli"
description = "The emmurt command: compiles htmlemmurt pages to HTML"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emmurt"
path = "src/main.rs"

[dependencies]
emmurt-core = { path = "../emmurt-core" }
serde_json.workspace = true

[dev-dependencies]
# Checks that the server files of `emmurt nuovo --completa` compile
fratm-core.workspace = true
