[workspace]
resolver = "2"
members = [
    "crates/emmurt-core",
    "crates/emmurt-cli",
    "crates/emmurt-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bitoesposito/htmlemmurt"

[workspace.dependencies]
# The FratmScript compiler, for <fratm> blocks and quanno-* handlers
fratm-core = { git = "https://github.com/kkratterf/fratmscript", tag = "v0.8.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
