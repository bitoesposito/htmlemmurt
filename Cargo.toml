[workspace]
resolver = "2"
members = [
    "crates/emmurt-core",
    "crates/emmurt-cli",
    "crates/emmurt-wasm",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/bitoesposito/htmlemmurt"

[workspace.dependencies]
# The FratmScript compiler, for <fratm> blocks and quanno-* handlers
# ponytail: the branch of kkratterf/fratmscript#236 until it is released; then back to a tag
fratm-core = { git = "https://github.com/bitoesposito/fratmscript", branch = "feat/shared-html-vocabulary" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
