[workspace]
resolver = "2"
members = [
    "crates/emmurt-core",
    "crates/emmurt-cli",
    "crates/emmurt-wasm",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bitoesposito/htmlemmurt"

[workspace.dependencies]
# FratmScript: the compiler for <fratm> blocks and quanno-* handlers, stile for
# <cess>, and the vocabulary (html.rs) shared with its JSX
fratm-core = { git = "https://github.com/kkratterf/fratmscript", tag = "v0.16.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
