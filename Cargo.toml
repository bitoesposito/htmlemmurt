[workspace]
resolver = "2"
members = [
    "crates/emmurt-core",
    "crates/emmurt-cli",
    "crates/emmurt-wasm",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bitoesposito/htmlemmurt"

[workspace.dependencies]
# FratmScript: the compiler for <fratm> blocks and quanno-* handlers, stile for
# <cess>, and the vocabulary (html.rs) shared with its JSX
# ponytail: a commit of FratmScript's main with kkratterf/fratmscript#264, #266 and
# #268, the one par-o-css uses, until they are released; then the tag again
fratm-core = { git = "https://github.com/kkratterf/fratmscript", rev = "d533b342f933e77e2d629a8a13b0472efe17d2a5" }
# par-o-css: <cess> and cess="…" are its strict CSS in Neapolitan, with its classes
parocss-core = { git = "https://github.com/bitoesposito/par-o-css", rev = "86a00100233d3a2478d23b11b22c17d8cf3802cb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
