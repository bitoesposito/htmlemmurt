name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check the examples
        run: |
          cargo build -p emmurt-cli --locked
          ./target/debug/emmurt check examples/*.emmurt examples/pezzi
          ./target/debug/emmurt check examples/pizzeria

  web:
    name: npm, VS Code, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin --strip-components=1 --wildcards '*/wasm-pack'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm package
        working-directory: packages/htmlemmurt
        run: npm run build && npm test
      - name: VS Code extension
        working-directory: packages/vscode-extension
        run: npm run compiler && npm test && npx --yes @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: htmlemmurt-vscode
          path: packages/vscode-extension/*.vsix
      - name: End-to-end in Chromium
        run: |
          (cd examples/pizzeria && npm ci)
          cd e2e && npm ci && npx playwright install --with-deps chromium && npm test
