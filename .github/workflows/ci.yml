name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check the examples
        run: |
          cargo build -p emmurt-cli --locked
          ./target/debug/emmurt check examples/*.emmurt examples/pezzi
          ./target/debug/emmurt check examples/pizzeria
          ./target/debug/emmurt fmt --check examples packages/playground crates/emmurt-cli/src/nuovo crates/emmurt-cli/src/nuovo-completa

  web:
    name: npm, VS Code, end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin --strip-components=1 --wildcards '*/wasm-pack'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm package
        working-directory: packages/htmlemmurt
        run: npm run build && npm test
      - name: VS Code extension
        working-directory: packages/vscode-extension
        run: npm run compiler && npm test && npx --yes @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: htmlemmurt-vscode
          path: packages/vscode-extension/*.vsix
      - name: An app made by emmurt nuovo builds
        run: |
          cargo run -q -p emmurt-cli -- nuovo "$RUNNER_TEMP/nova"
          cd "$RUNNER_TEMP/nova"
          # The package of this commit, not the one on npm
          npm pkg set devDependencies.htmlemmurt="file:$GITHUB_WORKSPACE/packages/htmlemmurt"
          npm install
          npx vite build
      - name: An app made by emmurt nuovo --completa builds and answers
        run: |
          cargo run -q -p emmurt-cli -- nuovo "$RUNNER_TEMP/completa" --completa
          cd "$RUNNER_TEMP/completa"
          npm pkg set devDependencies.htmlemmurt="file:$GITHUB_WORKSPACE/packages/htmlemmurt"
          npm install
          npx vite build
          PORT=3311 npm start &
          for i in $(seq 1 30); do curl -sf localhost:3311/api/pizze > /dev/null && break; sleep 1; done
          curl -sf localhost:3311/api/pizze | grep -q Margherita
          curl -sf -X POST -H 'content-type: application/json' -d '{"pizza":1}' localhost:3311/api/ordini
          curl -sf localhost:3311/api/ordini | grep -q '"pizze":1'
          curl -sf localhost:3311/ | grep -q '<template id="pizza">'
          kill %1
      - name: End-to-end in Chromium
        run: |
          (cd examples/pizzeria && npm ci)
          (cd packages/playground && npm ci && npm run build)
          cd e2e && npm ci && npx playwright install --with-deps chromium && npm test
